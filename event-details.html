<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - Event Locator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Event Locator</a>
            <button title="Toggle navigation" class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="events.html">All Events</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="mb-4">
            <button id="backToEvents" class="btn btn-outline-primary">Back to Events</button>
        </div>

        <div class="row gap-3">
            <div class="col-lg-7">
                <div class="card mb-4">
                    <img src="" class="card-img-top" alt="Event Image" id="eventImage">
                    <div class="card-body">
                        <h1 class="card-title" id="eventTitle"></h1>
                        <div class="d-flex align-items-center mb-3">
                            <span class="badge bg-primary me-2" id="eventCategory"></span>
                            <span class="text-muted" id="eventDate"></span>
                        </div>
                        <p class="lead" id="eventDescription"></p>
                        <div class="mb-4">
                            <h5>About This Event</h5>
                            <p id="eventAbout"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Event Details</h5>
                        <ul class="list-group list-group-flush mb-3">
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-calendar me-2"></i>Date</span>
                                <span id="eventDetailDate"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-clock me-2"></i>Time</span>
                                <span id="eventTime"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-geo-alt me-2"></i>Location</span>
                                <span id="eventLocation"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-currency-dollar me-2"></i>Price</span>
                                <span id="eventPrice"></span>
                            </li>
                        </ul>
                        <button class="btn btn-primary w-100" id="bookTicket">Book Now</button>
                    </div>
                </div>
                <div class="card mt-4 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Organizer</h5>
                        <p class="mb-2" id="eventOrganizer"></p>
                        <a href="#" class="btn btn-outline-primary btn-sm">Contact Organizer</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2025 Event Locator. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/script.js"></script>
</body>
</html>
